services:
  app:
    build:
      context: .
      target: dev
    container_name: acquisitions-app-dev
    env_file:
      - .env.development
    ports:
      - '3000:3000'
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run dev
    depends_on:
      - neon-local

  neon-local:
    image: neondatabase/neon_local:latest
    container_name: acquisitions-neon-local
    env_file:
      - .env.development
    ports:
      - '5432:5432'
