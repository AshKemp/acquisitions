name: Lint and Format

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run ESLint
        run: |
          if ! npm run lint; then
            echo "::error title=ESLint failed::ESLint found issues. Run npm run lint:fix to attempt an automatic fix." \
              && exit 1
          fi
      - name: Run Prettier check
        run: |
          if ! npm run format:check; then
            echo "::error title=Prettier check failed::Formatting issues detected. Run npm run format to fix formatting." \
              && exit 1
          fi
