name: Tests

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      NODE_OPTIONS: --experimental-vm-modules
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        id: run-tests
        run: |
          if ! npm test; then
            echo "::error title=Tests failed::Test suite failed. Review the logs and fix failing tests." \
              && exit 1
          fi
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage
          retention-days: 30
      - name: Write test summary
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "## Test Results" >> $GITHUB_STEP_SUMMARY
            echo "- All tests passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "## Test Results" >> $GITHUB_STEP_SUMMARY
            echo "- Tests failed. Check the workflow logs for details." >> $GITHUB_STEP_SUMMARY
          fi
          if [ -d coverage ]; then
            echo "- Coverage report artifact uploaded: coverage-report" >> $GITHUB_STEP_SUMMARY
          fi
